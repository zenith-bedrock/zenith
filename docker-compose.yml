# Docker/compose ops sample only — not used by `dotnet run`.
# Local runtime lives next to the DLL (AppContext.BaseDirectory).
# Embedded game palettes stay in src/zenith/data/.
services:
  zenith:
    build: .
    ports:
      - "19132:19132/udp"
    volumes:
      - ./deploy/zenith.yml:/app/zenith.yml
      - ./deploy/worlds:/app/worlds
    restart: unless-stopped
