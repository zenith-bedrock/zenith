# Root compose — thin wrapper so `docker compose up` from repo root still works.
# Canonical: deploy/compose/docker-compose.yml (ADR §20).
# Dokploy File Mount: see deploy/compose/dokploy.md (do not bake ../files into default compose).
services:
  zenith:
    build:
      context: .
      dockerfile: deploy/image/Dockerfile
    ports:
      - "19132:19132/udp"
    environment:
      ZENITH_DATA: /data
    volumes:
      - zenith-data:/data
    restart: unless-stopped

volumes:
  zenith-data:
