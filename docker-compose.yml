# Docker ops sample — not used by `dotnet run`.
# Persistent data lives under /data (single volume). Do not mount over /app (wipes the DLL).
services:
  zenith:
    build: .
    ports:
      - "19132:19132/udp"
    environment:
      ZENITH_DATA: /data
    volumes:
      - zenith-data:/data
    restart: unless-stopped

volumes:
  zenith-data:
