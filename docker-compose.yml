# Minimal LAN alpha compose (ADR §20).
# Mount config beside the DLL; mount worlds/ under the data root (/app).
# Sample zenith.yml must set world.path: /app (non-empty) or the world is InMemory and lost on restart.
services:
  zenith:
    build: .
    ports:
      - "19132:19132/udp"
    volumes:
      - ./data/zenith.yml:/app/zenith.yml
      - ./data/worlds:/app/worlds
    restart: unless-stopped
