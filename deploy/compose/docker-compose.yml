# Canonical Compose (ADR §20) — local / generic hosts.
# From repo root: docker compose -f deploy/compose/docker-compose.yml up --build
# Or: docker compose up --build  (root docker-compose.yml includes this file)
services:
  zenith:
    build:
      context: ../..
      dockerfile: deploy/image/Dockerfile
    ports:
      - "19132:19132/udp"
    environment:
      ZENITH_DATA: /data
    volumes:
      - zenith-data:/data
    restart: unless-stopped

volumes:
  zenith-data:
