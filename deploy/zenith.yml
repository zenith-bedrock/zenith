# yaml-language-server: $schema=../schemas/zenith.schema.json
# Docker/compose sample only — mounted at /app/zenith.yml.
# Local `dotnet run` uses the config next to the DLL (AppContext.BaseDirectory).
server:
  port: 19132
  motd: Zenith Bedrock
  sub-motd: Test
  max-players: 20
  max-players-per-ip: 3
  gamemode: Survival
world:
  # LevelDB at /app/worlds/world (compose mounts ./deploy/worlds → /app/worlds)
  name: world
  path: /app
  spawn-chunk-radius: 4
  # terrain: flat   # default — classic stone/grass at Y -61
  # terrain: noise  # overworld band + water/caves/trees/ruins (world.seed); fresh world folder recommended
  # seed: 1
auth:
  # Who may join (one or more). Case-insensitive.
  #   xbox         — Microsoft / FULL token
  #   self-signed  — Bedrock SELF_SIGNED (xname + leguuid), PocketMine-style offline
  #   offline      — ClientData/chain name fallbacks (empty xname LAN clients)
  # Public exposure: accept: [xbox] only.
  accept:
    - xbox
    - self-signed
    - offline
chat:
  max-length: 512
  rate-capacity: 8
  rate-refill-per-second: 4
network:
  compression-threshold: 256
# Independent severity ladders (ops-first defaults). Aliases: none|info|warn|error|debug|all
# info = Info|Warning|Error (not Info alone). Previous boot default was All for a shared logger.
log:
  server: info
  raknet: warn
